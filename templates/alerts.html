<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>IMCS - Alerts</title>

  <style>
    .app-shell{display:flex;height:100vh;overflow:hidden;background:#DFDFDF;}
  </style>

  <link rel="preload" href="/static/css/sap90.css" as="style" onload="this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="/static/css/sap90.css"></noscript>
</head>

<body>
<div class="app-shell">
  <aside class="app-sidebar">
    <button class="sidebar-toggle" title="Collapse sidebar">◀</button>
    <div class="brand">
      <img src="/static/icons/logo-imcs.svg" class="logo-img" alt="IMCS"/>
      <div class="title">Industrial Hub</div>
      <div class="muted small">Alerts</div>
    </div>
    <nav class="nav">
      <div class="nav-section">
        <div class="nav-section-header" data-section="main">
          <span class="nav-section-chevron">▼</span>
          <span class="nav-section-title">Main</span>
        </div>
        <div class="nav-section-items">
          <a href="/dashboard" class="nav-item" data-label="Dashboard"><img src="/static/icons/home.svg" width="16" height="16" alt=""/> <span>Dashboard</span></a>
          <a href="/machinery" class="nav-item" data-label="Machinery"><img src="/static/icons/machine.svg" width="16" height="16" alt=""/> <span>Machinery</span></a>
        </div>
      </div>

      <div class="nav-section">
        <div class="nav-section-header" data-section="operations">
          <span class="nav-section-chevron">▼</span>
          <span class="nav-section-title">Operations</span>
        </div>
        <div class="nav-section-items">
          <a href="/maintenance" class="nav-item" data-label="Maintenance"><img src="/static/icons/wrench.svg" width="16" height="16" alt=""/> <span>Maintenance</span></a>
          <a href="/alerts" class="nav-item active" data-label="Alerts"><img src="/static/icons/alert.svg" width="16" height="16" alt=""/> <span>Alerts</span></a>
        </div>
      </div>

      <div class="nav-section">
        <div class="nav-section-header" data-section="reporting">
          <span class="nav-section-chevron">▼</span>
          <span class="nav-section-title">Reporting</span>
        </div>
        <div class="nav-section-items">
          <a href="/reports" class="nav-item" data-label="Reports"><img src="/static/icons/chart.svg" width="16" height="16" alt=""/> <span>Reports</span></a>
        </div>
      </div>
    </nav>

    <!-- Navigation Footer -->
    <div class="nav-footer">
      <a href="/logout" class="nav-footer-btn" title="Sign out">
        <img src="/static/icons/alert.svg" width="14" height="14" alt=""> Sign Out
      </a>
    </div>
  </aside>

  <main class="app-main">
    <header class="app-header">
      <div class="brand">
        <div class="sap-badge">IMCS</div>
        <div>
          <div class="hdr-title">System Alerts</div>
        </div>
      </div>
      <div class="btn-group">
        <button class="btn" id="refreshBtn"><img src="/static/icons/refresh.svg" width="16" height="16" alt=""/> Refresh</button>
        <a href="/logout" class="btn" title="Logout"><img src="/static/icons/alert.svg" width="16" height="16" alt=""/> Logout</a>
      </div>
    </header>

    <div class="container">
      <div class="card">
        <div class="card-title">Current Alerts</div>
        <table class="table" id="alertsTable">
          <thead>
            <tr><th>ID</th><th>Machine</th><th>Severity</th><th>Message</th><th>Raised</th><th>Ack</th></tr>
          </thead>
          <tbody><tr><td colspan="6">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>

    <footer class="footer">IMCS · Alerts Monitor</footer>
  </main>
</div>

<script src="/static/js/app.js" defer></script>
<script src="/static/js/lazy.js" defer></script>
<script src="/static/js/alerts.js" defer></script>

<script>
  if('serviceWorker' in navigator) window.addEventListener('load', ()=> navigator.serviceWorker.register('/static/sw.js').catch(()=>{}));
</script>

</body>
</html>
